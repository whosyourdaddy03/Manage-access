<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#409eff"/>
      <stop offset="100%" stop-color="#1a56db"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67c23a"/>
      <stop offset="100%" stop-color="#36ad6a"/>
    </linearGradient>
  </defs>
  <!-- 圆形背景底座 -->
  <circle cx="100" cy="100" r="95" fill="url(#bg)" opacity="0.12"/>
  <!-- 六边形AI芯片 -->
  <polygon points="100,30 160,65 160,135 100,170 40,135 40,65" fill="url(#bg)" stroke="url(#bg)" stroke-width="2"/>
  <!-- 内部神经网络节点连线 -->
  <circle cx="100" cy="65" r="8" fill="white" opacity="0.95"/>
  <circle cx="75" cy="95" r="5" fill="white" opacity="0.8"/>
  <circle cx="125" cy="95" r="5" fill="white" opacity="0.8"/>
  <circle cx="100" cy="130" r="6" fill="white" opacity="0.9"/>
  <line x1="100" y1="73" x2="75" y2="90" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="100" y1="73" x2="125" y2="90" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="80" y1="98" x2="97" y2="125" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="120" y1="98" x2="103" y2="125" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <!-- AI 文字标记 -->
  <text x="100" y="157" text-anchor="middle" fill="white" font-weight="700" font-size="28" font-family="Arial,Helvetica Neue,sans-serif">AI</text>
</svg>
