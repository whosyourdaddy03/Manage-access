[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-ground-station-api"
version = "0.1.0"
description = "FastAPI gateway for the PX4 research ground station"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.9,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
]
mavsdk = ["mavsdk>=3.0,<4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
