# YOLOv8n-P2-EMA —— 面向小目标无人机的改进模型（论文"我的设计"之一）
# 相对基线 yolov8n 的两处改进：
#   1. +P2 检测头（stride=4，640 输入下特征图 160x160）→ 检出更小目标
#   2. +EMA 注意力（SPPF 后全局 1 处 + P2 分支 1 处）→ 抑制复杂背景干扰
# 消融对应：baseline_v8n / +P2（去掉 EMA 层）/ +P2+EMA（本文件）
nc: 1
scales:
  n: [0.33, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 1, EMA, []] # 10 EMA 注意力（骨干输出，全局上下文）

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 3, C2f, [512]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 3, C2f, [256]] # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 2], 1, Concat, [1]] # 18 cat backbone P2
  - [-1, 3, C2f, [128]] # 19 (P2/4-small)
  - [-1, 1, EMA, []] # 20 EMA 注意力（P2 小目标分支）

  - [-1, 1, Conv, [128, 3, 2]] # 21
  - [[-1, 16], 1, Concat, [1]] # 22 cat head P3
  - [-1, 3, C2f, [256]] # 23 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 24
  - [[-1, 13], 1, Concat, [1]] # 25 cat head P4
  - [-1, 3, C2f, [512]] # 26 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 27
  - [[-1, 9], 1, Concat, [1]] # 28 cat head P5
  - [-1, 3, C2f, [1024]] # 29 (P5/32-large)

  - [[20, 23, 26, 29], 1, Detect, [nc]] # Detect(P2, P3, P4, P5) 四尺度输出
